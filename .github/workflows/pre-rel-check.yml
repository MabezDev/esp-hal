# Check with a local registry.
#
# We want to check if we can compile examples/tests after bumping the deps by using a local registry.
# (i.e. if we will publish the right set of crates)
#
# The compile-test build runs on every release PR. The heavier examples/qa/tests build runs by
# default and is skipped only when the PR carries the `release:registry:skip-ci` label.
#
# The chip list (and the toolchain each chip builds with) is read from `.github/chips.json`, the
# same source the main CI uses, so adding a chip there is enough.

name: pre-release-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: macos-m1-self-hosted
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v6

      # A release PR embeds its plan in a ```jsonc block in the body; a
      # workflow_dispatch run must carry a checked-in `release_plan.jsonc`.
      # Anything else (an ordinary PR) has no plan, so the expensive registry
      # build below is skipped and the job passes quickly.
      - name: detect-plan
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BODY=$(gh pr view "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --json body -q .body || true)
            if printf '%s' "$BODY" | grep -q '```jsonc'; then
              echo "has_plan=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_plan=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ -f release_plan.jsonc ]; then
            echo "has_plan=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-toolchains
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        with:
          xtensa: "true"
          riscv: "true"

      # Install the Rust nightly toolchain for RISC-V devices:
      - uses: ./.github/actions/setup-nightly
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        with:
          targets: all
          components: rust-src
          alias: "true"

      - name: Setup cargo-batch
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        run: |
          if ! command -v cargo-batch &> /dev/null; then
              cargo install --git https://github.com/embassy-rs/cargo-batch cargo --bin cargo-batch --locked --force
          fi

      # Warm the chip-metadata cache while crates.io is still reachable. A cold
      # cache makes the later `build` step regenerate `esp-metadata-generated`,
      # which builds the `esp-metadata` tool - and that host tool cannot resolve
      # its dependencies (e.g. `prettyplease`) against the local registry.
      - name: warm-metadata-cache
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        run: cargo update-metadata

      # The plan comes straight from the PR body via `--plan-from-pr`. A
      # workflow_dispatch run has no PR number, so it falls back to the
      # checked-in `release_plan.jsonc`.
      - name: init-local-registry
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PLAN_ARG="--plan-from-pr ${{ github.event.pull_request.number }}"
          else
            PLAN_ARG="--plan release_plan.jsonc"
          fi
          cargo xrel-check init
          cargo xrel-check update $PLAN_ARG
          cargo xrel-check replace-path-deps $PLAN_ARG

      # Build the compile-tests against the local registry. This is the cheap
      # smoke test, so it runs on every release PR. Each chip uses the
      # `ci-toolchain` recorded for it in chips.json.
      - name: try-build [compile-tests]
        if: ${{ steps.plan.outputs.has_plan == 'true' }}
        shell: bash
        run: |
          for soc in $(jq -r '.[].soc' .github/chips.json); do
            toolchain=$(jq -r --arg s "$soc" \
              '.[] | select(.soc == $s) | ."ci-toolchain"' .github/chips.json)
            echo "::group::compile-tests $soc ($toolchain)"
            cargo xtask build compile-tests all "$soc" --toolchain "$toolchain"
            echo "::endgroup::"
          done

      # Build the examples/qa/tests against the local registry. Runs by default;
      # add `release:registry:skip-ci` to the PR to opt out of this heavy check.
      - name: try-build [examples/qa/tests]
        if: ${{ steps.plan.outputs.has_plan == 'true' && !contains(github.event.pull_request.labels.*.name, 'release:registry:skip-ci') }}
        shell: bash
        run: |
          # lints and docs are checked a couple of times already by other workflows
          for soc in $(jq -r '.[].soc' .github/chips.json); do
            toolchain=$(jq -r --arg s "$soc" \
              '.[] | select(.soc == $s) | ."ci-toolchain"' .github/chips.json)
            echo "::group::examples/qa/tests $soc ($toolchain)"
            cargo xcheck ci "$soc" --toolchain "$toolchain" --steps=lp-examples,examples,qa-test,tests
            echo "::endgroup::"
          done
